<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>AegisCloud — {{ code }}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}"></head>
<body>
<div style="min-height:100vh;display:grid;place-items:center;padding:24px">
  <div class="card" style="max-width:460px;text-align:center;padding:34px">
    <div style="font-family:var(--mono);font-size:52px;font-weight:800;background:var(--grad);
      -webkit-background-clip:text;background-clip:text;color:transparent">{{ code }}</div>
    <h3 style="margin:8px 0">{{ message }}</h3>
    <p class="tiny" style="margin-bottom:20px">The request was refused by the security layer.</p>
    <a class="btn primary" href="/">Back to the console</a>
  </div>
</div>
</body></html>
